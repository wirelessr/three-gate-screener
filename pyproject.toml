[project]
name = "three-gate-screener"
version = "0.1.0"
description = "Backtest & pipeline for the Taiwan-stock '三關篩選法' chip-flow strategy, using free-tier data sources."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CT Wu", email = "ifloveyou2008@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["taiwan-stock", "backtest", "finmind", "tdcc", "chip-flow", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Chinese (Traditional)",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "finmind>=1.8.0",
    "lxml>=6.1.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/wirelessr/three-gate-screener"
Repository = "https://github.com/wirelessr/three-gate-screener.git"
Issues = "https://github.com/wirelessr/three-gate-screener/issues"

[project.scripts]
three-gate-verify = "three_gate_screener.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
